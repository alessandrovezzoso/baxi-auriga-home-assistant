modbus:
  - name: auriga                        # Name of this hub
    type: tcp                           # Type of modbus
    host: 192.168.188.231               # IP address or name of modbus device
    port: 502                           # Network port for the communication (modbus tcp default port: 502)
    delay: 5                            # Time to delay sending messages in seconds after connecting
    timeout: 5                          # Timeout while waiting for a response in seconds
    message_wait_milliseconds: 100      # Time to wait in milliseconds between requests

    ############################################################################################################
    ### SENSORS ################################################################################################
    ############################################################################################################
    sensors:
      # SETTING PARAMETERS ################################################################


      # Power on/off
      # BIT0: room heating              0 power off; 1 power on
      # BIT1: air conditioner (zone 1)  0 power off; 1 power on
      # BIT2: domestic hot water        0 power off; 1 power on
      # BIT3: air conditioner (zone 2)  0 power off; 1 power on
      # BIT4 - BIT15: Reserved
      - name: "System power state RAW"
        address: 0
        scan_interval: 30
        slave: 1
        unique_id: auriga_raw_system_power_state
        data_type: uint16
        input_type: holding

      # Setting mode
      # (1: auto, 2: cool, 3: heat)
      - name: "Setting mode"
        address: 1
        scan_interval: 30
        slave: 1
        unique_id: auriga_setting_mode
        data_type: uint16
        input_type: holding

      # Setting water temperature T1s (8 bit heating, 8 bit cooling)
      - name: "Setting water temperature T1s RAW"
        address: 2
        scan_interval: 60
        slave: 1
        unique_id: auriga_raw_setting_water_temperature_t1s
        data_type: int16
        input_type: holding

      # Setting water temperature Ts
      # Value between 17 and 30 °C and is valid when there is Ta
      - name: "Setting air temperature"
        address: 3
        scan_interval: 60
        slave: 1
        unique_id: auriga_setting_air_temperature_ts
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Setting water tank temperature T5s
      # Value between 40 and 60 °C
      - name: "Setting water tank temperature"
        address: 4
        scan_interval: 60
        slave: 1
        unique_id: auriga_setting_water_tank_temperature_t5s
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Function setting
      # BIT4: Disinfect
      # BIT6: Silent mode
      # BIT7: Silent mode level (0:Silent mode level 1; 1:Silent mode level 2)
      # BIT10: Eco mode
      # BIT11: DHW pump is running constant-temperature water recycling
      # BIT12: Curve setting (0:disabled; 1:enabled)
      - name: "Function setting RAW"
        address: 5
        scan_interval: 30
        slave: 1
        unique_id: auriga_raw_function_setting
        data_type: uint16
        input_type: holding

      # Curve selection
      # Value between 1 and 8 (8 bit heating, 8 bit cooling)
      - name: "Curve selection RAW"
        address: 6
        scan_interval: 300
        slave: 1
        unique_id: auriga_raw_curve_selection
        data_type: uint16
        input_type: holding

      # Forced water heating
      # (0: invalid, 1: forced on, 2: forced off)
      - name: "Forced water heating"
        address: 7
        scan_interval: 60
        slave: 1
        unique_id: auriga_forced_water_heating
        data_type: uint16
        input_type: holding

      # Forced electric water tank heater
      # (0: invalid, 1: forced on, 2: forced off)
      - name: "Forced electric water tank heater"
        address: 8
        scan_interval: 60
        slave: 1
        unique_id: auriga_forced_tbh
        data_type: uint16
        input_type: holding

      # Forced water heating
      # (0: invalid, 1: forced on, 2: forced off)
      - name: "Forced electric heater"
        address: 9
        scan_interval: 60
        slave: 1
        unique_id: auriga_forced_ibh1
        data_type: uint16
        input_type: holding


      # RUNNING PARAMETERS ################################################################


      # Compressor operating frequency
      - name: "Compressor operating frequency"
        address: 100
        scan_interval: 15
        slave: 1
        unique_id: auriga_operating_frequency
        data_type: uint16
        input_type: holding
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement

      # Actual operating mode 
      # (0: off, 2: cooling, 3: heating)
      - name: "Operating mode"
        address: 101
        scan_interval: 30
        slave: 1
        unique_id: auriga_operating_mode
        data_type: uint16
        input_type: holding

      # Fans speed
      - name: "Fan speed"
        address: 102
        scan_interval: 30
        slave: 1
        unique_id: auriga_fan_speed
        data_type: uint16
        input_type: holding
        unit_of_measurement: "rpm"
        state_class: measurement

      # Electronic expansion valve openness (multiples di 8)
      - name: "Electronic expansion valve openness"
        address: 103
        scan_interval: 30
        slave: 1
        unique_id: auriga_pmv_openness
        data_type: uint16
        input_type: holding
        state_class: measurement

      # Water inlet temperature
      - name: "Water inlet temperature"               # TW_in
        address: 104
        scan_interval: 15
        slave: 1
        unique_id: auriga_twin_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Water outlet temperature
      - name: "Water outlet temperature"              # TW_out
        address: 105
        scan_interval: 15
        slave: 1
        unique_id: auriga_twout_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Condenser temperature
      - name: "Condenser temperature"
        address: 106
        scan_interval: 30
        slave: 1
        unique_id: auriga_t3_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Outdoor ambient temperature
      - name: "Outdoor ambient temperature"
        address: 107
        scan_interval: 30
        slave: 1
        unique_id: auriga_t4_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Compressor discharge temperature
      - name: "Discharge temperature"                 # Tp
        address: 108
        scan_interval: 30
        slave: 1
        unique_id: auriga_tp_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Compressor return air temperature
      - name: "Return air temperature"                # Th
        address: 109
        scan_interval: 30
        slave: 1
        unique_id: auriga_th_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Total water outlet temperature
      - name: "Total water outlet temperature"        # T1
        address: 110
        scan_interval: 15
        slave: 1
        unique_id: auriga_t1_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Total water outlet temperature (behind the auxiliary heater)
      - name: "Total water outlet temperature (behind the auxiliary heater)"        # T1B
        address: 111
        scan_interval: 15
        slave: 1
        unique_id: auriga_t1b_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Refrigerant liquid side temperature
      - name: "Refrigerant liquid side temperature"   # T2
        address: 112
        scan_interval: 15
        slave: 1
        unique_id: auriga_t2_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Refrigerant gas side temperature
      - name: "Refrigerant gas side temperature"      # T2B
        address: 113
        scan_interval: 15
        slave: 1
        unique_id: auriga_t2b_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Room temperature
      - name: "Room temperature"                      # Ta
        address: 114
        scan_interval: 30
        slave: 1
        unique_id: auriga_ta_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Domestic hot water temperature
      - name: "Domestic hot water tank temperature"   # T5
        address: 115
        scan_interval: 30
        slave: 1
        unique_id: auriga_t5_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Outdoor unit high pressure value
      - name: "Outdoor unit high pressure"
        address: 116
        scan_interval: 15
        slave: 1
        unique_id: auriga_pressure1
        data_type: uint16
        input_type: holding
        unit_of_measurement: "kPa"
        device_class: pressure
        state_class: measurement

      # Outdoor unit low pressure value
      - name: "Outdoor unit low pressure"
        address: 117
        scan_interval: 15
        slave: 1
        unique_id: auriga_pressure2
        data_type: uint16
        input_type: holding
        unit_of_measurement: "kPa"
        device_class: pressure
        state_class: measurement

      # Outdoor unit operating current
      - name: "Outdoor unit operating current"
        address: 118
        scan_interval: 15
        slave: 1
        unique_id: auriga_operating_current
        data_type: uint16
        input_type: holding
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement

      # Outdoor unit voltage
      - name: "Outdoor unit voltage"
        address: 119
        scan_interval: 15
        slave: 1
        unique_id: auriga_voltage
        data_type: uint16
        input_type: holding
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement

      # Compressor operating time
      - name: "Compressor operating time"
        address: 122
        scan_interval: 300
        slave: 1
        unique_id: auriga_compressor_operating_time
        data_type: uint16
        input_type: holding
        unit_of_measurement: "h"
        device_class: duration
        state_class: total_increasing

      # Current fault
      - name: "Current fault"
        address: 124
        scan_interval: 30
        slave: 1
        unique_id: auriga_current_fault
        data_type: uint16
        input_type: holding

      # Status bit 1
      # BIT1: Defrosting
      # BIT2: Anti-freezing
      # BIT3: Oil return
      # BIT4: Remote On/Off
      # BIT5: Outdoor unit test mode, 
      # BIT6: Room temperature controller (heating)
      # BIT7: Room temperature controller (cooling)
      # BIT8: Solar energy signal input
      # BIT10: SG 1=normal electricity, 0=high price electricity
      # BIT11: EUV 1=free electricity, 0=judge by SG signal
      - name: "Status bit 1"
        address: 128
        scan_interval: 15
        slave: 1
        unique_id: auriga_status_bit1
        data_type: uint16
        input_type: holding

      # Load output
      # BIT0: Electric heater IBH1
      # BIT2: Domestic hot water electric heater TBH
      # BIT3: Internal water pump PUMP_I
      # BIT4: Three way valve SV1
      # BIT6: External water pump P_o
      # BIT7: Water return water P_d
      # BIT8: Mixed water pump P_c
      # BIT9: Three way valve SV2
      # BIT10: HEAT4
      # BIT11: Solar water pump P_s
      # BIT12: Alarm
      # BIT13: Run
      # BIT14: External heater
      # BIT15: Defrost
      - name: "Load output"
        address: 129
        scan_interval: 15
        slave: 1
        unique_id: auriga_load_output
        data_type: uint16
        input_type: holding

      # Hydraulic module's version number
      - name: "Hydraulic module version number"
        address: 130
        scan_interval: 3600
        slave: 1
        unique_id: auriga_hydraulic_module_version_number
        data_type: uint16
        input_type: holding

      # Wired controller version number
      - name: "Wired controller version number"
        address: 131
        scan_interval: 3600
        slave: 1
        unique_id: auriga_wired_controller_version_number
        data_type: uint16
        input_type: holding

      # Unit target frequency
      - name: "Unit target frequency"
        address: 132
        scan_interval: 30
        slave: 1
        unique_id: auriga_unit_target_frequency
        data_type: uint16
        input_type: holding
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement

      # DC bus current
      - name: "DC bus current"
        address: 133
        scan_interval: 15
        slave: 1
        unique_id: auriga_dc_bus_current
        data_type: uint16
        input_type: holding
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement

      # DC bus voltage
      - name: "DC bus voltage"
        address: 134
        scan_interval: 15
        slave: 1
        unique_id: auriga_dc_bus_voltage
        data_type: uint16
        scale: 0.1
        input_type: holding
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement

      # Inverter module temperature
      - name: "Inverter module temperature"      # TF
        address: 135
        scan_interval: 15
        slave: 1
        unique_id: auriga_tf_temperature
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Hydraulic module curve T1S calculated value 1
      - name: "Hydraulic module curve T1S calculated value 1"   # 
        address: 136
        scan_interval: 30
        slave: 1
        unique_id: auriga_t1s_calculated_temperature_calc1
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Hydraulic module curve T1S calculated value 2
      - name: "Hydraulic module curve T1S calculated value 2"   # 
        address: 137
        scan_interval: 30
        slave: 1
        unique_id: auriga_t1s_calculated_temperature_calc2
        data_type: int16
        input_type: holding
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      # Water flow
      - name: "Water flow"
        address: 138
        scan_interval: 30
        slave: 1
        unique_id: auriga_water_flow
        data_type: uint16
        input_type: holding
        unit_of_measurement: "m³/h"
        device_class: volume_flow_rate
        state_class: measurement

      # Limit outdoor unit current
      - name: "Limit outdoor unit current"
        address: 139
        scan_interval: 300
        slave: 1
        unique_id: auriga_limit_outdoor_unit_current
        data_type: uint16
        input_type: holding
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement

      # Ability of hydraulic module
      - name: "Ability of hydraulic module"
        address: 140
        scan_interval: 60
        slave: 1
        unique_id: auriga_ability_hydraulic_mode
        data_type: uint16
        scale: 0.01
        precision: 2
        input_type: holding
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
      

      # SETTING INSTALLATOR PARAMETERS ####################################################


      # Parameter setting 1
      # BIT0: Priority              0 room cooling/heating first; 1 DHW first
      # BIT1: Dual room thermostat  0 not supported; 1 supported
      # BIT2: Room thermostat
      # BIT3: Supports room thermostat
      # BIT4: Supports room temperature (sensor Ta)
      # BIT5: Supports sensor T1
      # BIT6: T1s heating high/low temperature settings (read-only)
      # BIT7: Enable heating
      # BIT8: T1s cooling high/low temperature settings (read-only)
      # BIT9: Enable cooling
      # BIT10: DHW pump supports Pipe Disinfect
      # BIT12: DHW pump             0 not supported; 1 supported
      # BIT13: Support disinfection
      # BIT14: Support water tank electric heater TBH (read-only)
      # BIT15: Enable water heating
      - name: "Parameter setting 1 RAW"
        address: 210
        scan_interval: 30
        slave: 1
        unique_id: auriga_raw_parameter_setting_1
        data_type: uint16
        input_type: holding
      
      # Parameter setting 2
      # BIT3: Double zone setting is valid
      # BIT4: Setting the high/low temperature of heating mode T1s
      # BIT5: Setting the high/low temperature of cooling mode T1s
      # BIT6: Enable Tw2            0 no; 1 yes
      # BIT7: Smart grid            0 no; 1 yes
      # BIT8: Define the port       0 remote ON/OFF; 1 DHW heater
      - name: "Parameter setting 2 RAW"
        address: 211
        scan_interval: 30
        slave: 1
        unique_id: auriga_raw_parameter_setting_2
        data_type: uint16
        input_type: holding




############################################################################################################
### TEMPLATE ###############################################################################################
############################################################################################################
template:
  ## Select ################################################################################################
  - select:
    # Operating mode (register no.1)
    - name: "Setting operating mode"
      unique_id: auriga_setting_operating_mode
      options: "{{ ['Auto', 'Cooling', 'Heating'] }}"
      state: >
        {% set m = states('sensor.setting_mode') | int(0) %}
        {% if m == 1 %}Auto
        {% elif m == 2 %}Cooling
        {% elif m == 3 %}Heating
        {% endif %}
      select_option:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 1
            value: >
              {% if option == 'Auto' %}1
              {% elif option == 'Cooling' %}2
              {% elif option == 'Heating' %}3
              {% endif %}
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.setting_mode
  
    # Silent mode switch + silent mode level (register no.5: BIT6 = on/off, BIT7 = level)
    - name: "Setting silent mode"
      unique_id: auriga_setting_silent_mode
      options: "{{ ['Not active', 'Level 1', 'Level 2'] }}"
      state: "{{ 'Not active' if (states('sensor.function_setting_raw') | int(0)) | bitwise_and(64) == 0 else ('Level 2' if (states('sensor.function_setting_raw') | int(0)) | bitwise_and(128) > 0 else 'Level 1') }}"
      select_option:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 5
            value: "{{ (states('sensor.function_setting_raw') | int(0) | bitwise_and(65471)) if option == 'Not active' else ((states('sensor.function_setting_raw') | int(0) | bitwise_or(64) | bitwise_and(65407)) if option == 'Level 1' else (states('sensor.function_setting_raw') | int(0) | bitwise_or(192))) }}"
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.function_setting_raw

    # Heating curve (register no.6: low byte + register no.5: BIT12)
    - name: "Heating curve selection"
      unique_id: auriga_setting_heating_curve
      options: "{{ ['Not active', '1', '2', '3', '4', '5', '6', '7', '8'] }}"
      state: "{{ 'Not active' if (states('sensor.function_setting_raw') | int(0)) | bitwise_and(4096) == 0 else (states('sensor.curve_selection_raw') | int(0) % 256) | string }}"
      select_option:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 5
            value: "{{ (states('sensor.function_setting_raw') | int(0) | bitwise_and(61439)) if option == 'Not active' else (states('sensor.function_setting_raw') | int(0) | bitwise_or(4096)) }}"
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 6
            value: "{{ states('sensor.curve_selection_raw') | int(0) if option == 'Not active' else ((states('sensor.curve_selection_raw') | int(0) // 256) * 256 + (option | int)) }}"
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id:
              - sensor.function_setting_raw
              - sensor.curve_selection_raw

    # Cooling curve (register no.6: high byte + register no.5: BIT12)
    - name: "Cooling curve selection"
      unique_id: auriga_setting_cooling_curve
      options: "{{ ['Not active', '1', '2', '3', '4', '5', '6', '7', '8'] }}"
      state: "{{ 'Not active' if (states('sensor.function_setting_raw') | int(0)) | bitwise_and(4096) == 0 else (states('sensor.curve_selection_raw') | int(0) // 256) | string }}"
      select_option:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 5
            value: "{{ (states('sensor.function_setting_raw') | int(0) | bitwise_and(61439)) if option == 'Not active' else (states('sensor.function_setting_raw') | int(0) | bitwise_or(4096)) }}"
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 6
            value: "{{ states('sensor.curve_selection_raw') | int(0) if option == 'Not active' else ((option | int) * 256 + (states('sensor.curve_selection_raw') | int(0) % 256)) }}"
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id:
              - sensor.function_setting_raw
              - sensor.curve_selection_raw

    # Forced water heating (register no.7)
    - name: "Forced water heating"
      unique_id: auriga_setting_forced_water_heating
      options: "{{ ['Auto', 'Forced on', 'Forced off'] }}"
      state: "{{ 'Auto' if states('sensor.forced_water_heating') | int(0) == 0 else ('Forced on' if states('sensor.forced_water_heating') | int(0) == 1 else 'Forced off') }}"
      select_option:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 7
            value: "{{ 0 if option == 'Auto' else (1 if option == 'Forced on' else 2) }}"
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.forced_water_heating

    # Forced electric water tank heater TBH (register no.8)
    - name: "Forced electric water tank heater"
      unique_id: auriga_setting_forced_tbh
      options: "{{ ['Auto', 'Forced on', 'Forced off'] }}"
      state: "{{ 'Auto' if states('sensor.forced_electric_water_tank_heater') | int(0) == 0 else ('Forced on' if states('sensor.forced_electric_water_tank_heater') | int(0) == 1 else 'Forced off') }}"
      select_option:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 8
            value: "{{ 0 if option == 'Auto' else (1 if option == 'Forced on' else 2) }}"
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.forced_electric_water_tank_heater

    # Forced electric heater IBH1 (register no.9)
    - name: "Forced electric heater"
      unique_id: auriga_setting_forced_ibh1
      options: "{{ ['Auto', 'Forced on', 'Forced off'] }}"
      state: "{{ 'Auto' if states('sensor.forced_electric_heater') | int(0) == 0 else ('Forced on' if states('sensor.forced_electric_heater') | int(0) == 1 else 'Forced off') }}"
      select_option:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 9
            value: "{{ 0 if option == 'Auto' else (1 if option == 'Forced on' else 2) }}"
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.forced_electric_heater

  ## Number ################################################################################################
  - number:
    # Heating water temperature (register no.2, low byte)
    - name: "Setting heating water temperature"
      unique_id: auriga_setting_heating_water_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      min: 35
      max: 60
      step: 1
      state: "{{ states('sensor.setting_water_temperature_t1s_raw') | int(0) % 256 }}"
      set_value:
        - action: modbus.write_register
          data:
            hub: auriga
            slave: 1
            address: 2
            value: "{{ (states('sensor.setting_water_temperature_t1s_raw') | int(0) // 256) * 256 + (value | int) }}"
        - delay:
            milliseconds: 500
        - action: homeassistant.update_entity
          target:
            entity_id: sensor.setting_water_temperature_t1s_raw
 
    # Cooling water temperature (register no.2, high byte)
    - name: "Setting cooling water temperature"
      unique_id: auriga_setting_cooling_water_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      min: 5
      max: 25
      step: 1
