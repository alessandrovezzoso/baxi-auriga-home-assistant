# Power on/off
# BIT0: floor heating             0 power off; 1 power on
# BIT1: air conditioner (zone 1)  0 power off; 1 power on
# BIT2: domestic hot water        0 power off; 1 power on
# BIT3: air conditioner (zone 2)  0 power off; 1 power on
# BIT4 - BIT15: Reserved
- name: "System power state"
  address: 0
  scan_interval: 30
  slave: 1
  unique_id: auriga_system_power_state
  data_type: uint16
  input_type: holding

# Setting mode
# 1: Auto
# 2: Cool
# 3: Heat
- name: "Setting mode"
  address: 1
  scan_interval: 30
  slave: 1
  unique_id: auriga_setting_mode
  data_type: uint16
  input_type: holding

# Setting water temperature T1s
- name: "Setting water temperature"
  address: 2
  scan_interval: 60
  slave: 1
  unique_id: auriga_setting_water_temperature_t1s
  data_type: int16
  input_type: holding
  unit_of_measurement: "°C"
  device_class: temperature
  state_class: measurement

# Frequenza operativa del compressore
- name: "Compressor operating frequency"
  address: 100
  scan_interval: 15
  slave: 1
  unique_id: auriga_operating_frequency
  data_type: int16
  input_type: holding
  unit_of_measurement: "Hz"
  device_class: frequency
  state_class: measurement

# Modalita operativa attuale dell'unita (0: off, 2: cooling, 3: heating)
- name: "Operating mode"
  address: 101
  scan_interval: 30
  slave: 1
  unique_id: auriga_operating_mode
  data_type: int16
  input_type: holding

# Velocità della ventola
- name: "Fan speed"
  address: 102
  scan_interval: 30
  slave: 1
  unique_id: auriga_fan_speed
  data_type: int16
  input_type: holding
  unit_of_measurement: "rpm"
  state_class: measurement

# Apertura della valvola di espansione elettronica (multipli di 8)
- name: "Electronic expansion valve openness"
  address: 103
  scan_interval: 30
  slave: 1
  unique_id: auriga_pmv_openness
  data_type: int16
  input_type: holding
  state_class: measurement

