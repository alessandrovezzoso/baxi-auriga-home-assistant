#
- name: "Current fault"
  address: 124
  scan_interval: 30
  slave: 1
  unique_id: auriga_current_fault
  input_type: holding

# Bit di stato 1
# BIT1: Sbrinamento, 
# BIT2: Antigelo, 
# BIT3: Ritorno olio, 
# BIT4: Remote On/Off, 
# BIT5: Segnale test unità esterna, 
# BIT6: Termostato (riscaldamento), 
# BIT7: Termostato (raffreddamento), 
# BIT8: Input solare, 
# BIT10: SG 1=normale, 0=prezzo alto, 
# BIT11: EUV 1=elettricità gratis, 0=valuta segnale SG
- name: "Status bit 1"
  address: 128
  scan_interval: 15
  slave: 1
  unique_id: auriga_status_bit1
  input_type: holding